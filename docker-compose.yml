version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - REDIS_URL=redis:6379
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/teztynda?sslmode=disable
      - STT_PROVIDER=fake
      - LLM_PROVIDER=fake
      - MAX_CONTEXT_TOKENS=3000
      - SHORT_MEMORY_TOKENS=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - REDIS_URL=redis:6379
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/teztynda?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=teztynda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teztynda"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
